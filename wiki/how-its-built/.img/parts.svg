svg.sketch .fill-hub { fill: var(--hub, oklch(92% 0.01 60)); }
svg.sketch .fill-glass { fill: var(--glass, oklch(97.5% 0.002 60 / .82)); }
svg.sketch .fill-sheer { fill: var(--sheer, oklch(97.5% 0.002 60 / .6)); }
svg.sketch .fill-bezel { fill: var(--bezel, rgb(255 255 255 / .9)); }
