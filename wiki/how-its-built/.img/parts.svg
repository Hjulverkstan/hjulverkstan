svg.sketch .stroke-rest { stroke: var(--rest, oklch(88% calc(0.045 * var(--hk, 1)) var(--h, 60))); fill: none; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.sketch .stroke-door { stroke: var(--door, oklch(74% calc(0.085 * var(--hk, 1)) var(--h, 60))); fill: none; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.sketch .stroke-on { stroke: var(--on, oklch(42% calc(0.072 * var(--hk, 1)) var(--h, 60))); fill: none; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.sketch .stroke-lit { stroke: var(--lit, oklch(60% calc(0.12 * var(--hk, 1)) var(--h, 60))); fill: none; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.sketch .stroke-glow { stroke: var(--glow, oklch(80% calc(0.08 * var(--hk, 1)) var(--h, 60))); fill: none; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
