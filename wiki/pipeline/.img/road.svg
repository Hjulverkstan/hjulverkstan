svg.sketch .fill-on { fill: var(--on, oklch(42% 0.072 var(--h, 60))); }
svg.sketch .fill-lit { fill: var(--lit, oklch(60% 0.12 var(--h, 60))); }
svg.sketch .fill-glow { fill: var(--glow, oklch(80% 0.08 var(--h, 60))); }
svg.sketch .fill-grey { fill: var(--grey, oklch(90% 0 0)); }
