svg.sketch .stroke-sheer { stroke: var(--sheer, oklch(97.5% 0.002 60 / .6)); fill: none; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
svg.sketch .stroke-bezel { stroke: var(--bezel, rgb(255 255 255 / .9)); fill: none; stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
